<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas 2 - Data Pegawai</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 32px;
      color: #222;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }
    .wrap {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 820px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px 12px;
      text-align: left;
    }
    thead th {
      background: #2f4858;
      color: #fff;
    }
    tfoot td {
      background: #eef2f4;
      font-weight: bold;
    }
    .angka {
      text-align: right;
    }
  </style>
</head>
<body>

  <h1>Data Pegawai</h1>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Nama Pegawai</th>
          <th>Umur</th>
          <th>Jabatan</th>
          <th>Status</th>
          <th>Gaji Pokok</th>
          <th>Tunjangan Jabatan (15%)</th>
          <th>BPJS (10%)</th>
          <th>Tunjangan Keluarga (20%)</th>
        </tr>
      </thead>
      <tbody id="isi-tabel"></tbody>
      <tfoot id="kaki-tabel"></tfoot>
    </table>
  </div>

  <script>
    let nama    = "Dodi Prayodi";
    let umur    = 25;
    let jabatan = "Manajer";
    let status  = "Menikah";

    let gapok;
    if (jabatan === "Manajer") {
      gapok = 15000000;
    } else if (jabatan === "Asisten Manajer") {
      gapok = 10000000;
    } else if (jabatan === "Staff") {
      gapok = 5000000;
    } else {
      gapok = 0;
    }

    let tunjanganJabatan = gapok * 0.15;

    let bpjs = gapok * 0.10;

    let tunjanganKeluarga = (status === "Menikah") ? gapok * 0.20 : 0;

    let totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

    function rupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    document.getElementById("isi-tabel").innerHTML =
      "<tr>" +
        "<td>" + nama + "</td>" +
        "<td>" + umur + " tahun</td>" +
        "<td>" + jabatan + "</td>" +
        "<td>" + status + "</td>" +
        "<td class='angka'>" + rupiah(gapok) + "</td>" +
        "<td class='angka'>" + rupiah(tunjanganJabatan) + "</td>" +
        "<td class='angka'>" + rupiah(bpjs) + "</td>" +
        "<td class='angka'>" + rupiah(tunjanganKeluarga) + "</td>" +
      "</tr>";

    document.getElementById("kaki-tabel").innerHTML =
      "<tr>" +
        "<td colspan='7'>Total Gaji</td>" +
        "<td class='angka'>" + rupiah(totalGaji) + "</td>" +
      "</tr>";
  </script>

</body>
</html>
